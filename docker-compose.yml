# docker compose up -d
services:
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
    volumes:
      - ./data:/var/lib/neo4j/import   # lets LOAD CSV read file:///airports.csv

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    command: ["--replSet", "rs0", "--bind_ip_all"]   # replica set => transactions work
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      retries: 20
